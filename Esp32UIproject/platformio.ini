[env]
platform = espressif32
board = esp32dev
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_port = COM12
board_build.filesystem = littlefs

[env:serial]
upload_protocol = esptool
upload_speed = 115200
upload_port = COM12